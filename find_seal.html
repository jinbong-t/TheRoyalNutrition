<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>낙관 찾기 도구</title>
</head>
<body style="background: #222; color: white; text-align: center; font-family: sans-serif;">
    <h2>이미지에서 '尙宮' 낙관(도장)이 있는 곳을 클릭해 보세요!</h2>
    <p>클릭하면 해당 위치의 정확한 % 좌표를 알려드립니다.</p>
    <div style="display: inline-block; border: 2px solid gold;">
        <img src="온오프라인 버전 최상궁 단서 조각.png" id="img" style="max-width: 800px; cursor: crosshair; display: block;">
    </div>
    <script>
        document.getElementById('img').addEventListener('click', function(e) {
            let rect = e.target.getBoundingClientRect();
            let x = ((e.clientX - rect.left) / rect.width) * 100;
            let y = ((e.clientY - rect.top) / rect.height) * 100;
            let coord = Math.round(x) + "% " + Math.round(y) + "%";
            alert("이 위치의 좌표는 " + coord + " 입니다.\n저에게 이 좌표를 알려주시면 바로 적용해 드리겠습니다!");
        });
    </script>
</body>
</html>

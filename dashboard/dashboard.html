<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>수라간의 비밀 - 교사용 관제실</title>
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Noto+Serif+KR:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="dashboard.css">
</head>
<body>
    <header>
        <div class="header-top">
            <h1>수라간의 비밀 : 교사용 관제실</h1>
            <div class="header-stats" style="display: flex; align-items: center; gap: 20px;">
                <div class="version-selector" style="display: flex; align-items: center; gap: 10px; background: rgba(0,0,0,0.3); padding: 5px 15px; border-radius: 8px; border: 1px solid var(--color-border);">
                    <label style="font-weight: bold; color: var(--color-accent-light);">진행 방식 :</label>
                    <select id="game-version-select" onchange="saveGameVersion()" style="padding: 5px 10px; background: #333; color: #fff; border: 1px solid var(--color-accent); border-radius: 4px; font-family: inherit; font-size: 1rem; cursor: pointer;">
                        <option value="online">온라인 단독 버전</option>
                        <option value="combined">온오프라인 결합 버전</option>
                    </select>
                </div>
                <span>입궐 모둠 : <strong id="total-teams" style="color: var(--color-accent-light); font-size:1.4rem;">0</strong> 팀</span>
                <button onclick="resetData()" class="btn-danger">기록 파기 (초기화)</button>
            </div>
        </div>
        
        <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px;">
            <div class="api-setting-panel">
                <label for="ai-api-key" style="font-weight: bold; color: var(--color-accent-light);">어의(AI) 신통력 부여 (API 키) :</label>
                <input type="password" id="ai-api-key" class="api-input" placeholder="신비로운 문자열을 입력하시옵소서 (Gemini/OpenAI)">
                <button onclick="saveApiKey()" class="btn-primary">하사하기 (저장)</button>
                <span id="api-save-status" style="color: var(--color-success); display: none; font-weight: bold;">✔ 성은이 망극하옵니다!</span>
            </div>
            
            <div class="search-panel">
                <input type="text" id="search-input" onkeyup="filterTeams()" placeholder="🔎 수사관 검색 (예: 3반, 1모둠)" style="padding: 8px 15px; border-radius: 4px; border: 1px solid var(--color-accent); background: rgba(0,0,0,0.5); color: #fff; width: 280px; font-family: inherit; font-size: 1rem;">
            </div>
        </div>
    </header>

    <main>
        <table class="dashboard-table">
            <thead>
                <tr>
                    <th style="width: 12%;">수사관 (모둠)</th>
                    <th style="width: 33%;">수사 진척도 (관문)</th>
                    <th style="width: 40%;">범행 추리 근거</th>
                    <th style="width: 15%;">어의 문진표</th>
                </tr>
            </thead>
            <tbody id="team-list-body">
                <tr>
                    <td colspan="4" style="color: #888; padding: 40px;">입궐한 수사관을 기다리는 중이옵니다...</td>
                </tr>
            </tbody>
        </table>
    </main>

    <!-- 모달: 어의 문진표 -->
    <div id="counseling-modal">
        <div class="modal-content">
            <button onclick="closeCounselingModal()" class="btn-close">&times;</button>
            
            <h2 id="modal-team-name" class="modal-title">수사관 문진 기록</h2>
            
            <div class="modal-section">
                <h3 class="section-title-1">📜 초기 수라상 (기존 식단)</h3>
                <div id="modal-original-diet" class="modal-box"></div>
            </div>

            <div class="modal-section" style="flex-grow: 1;">
                <h3 class="section-title-2">🩺 어의(AI) 문진 내역</h3>
                <div id="modal-chat-log" class="chat-box">
                    <!-- 채팅 내역 -->
                </div>
            </div>

            <div class="modal-section" style="margin-bottom: 0;">
                <h3 class="section-title-3">🍲 최종 수라상 처방</h3>
                <div id="modal-final-diet" class="modal-box final-diet-box"></div>
            </div>
        </div>
    </div>

    <script type="module" src="../app/firebase-config.js"></script>
    <script type="module" src="dashboard.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>수라간의 비밀 - 교사용 관제실</title>
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Noto+Serif+KR:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="dashboard.css">
</head>
<body>
    <header>
        <div class="header-top">
            <h1>수라간의 비밀 : 교사용 관제실</h1>
            <div class="header-stats" style="display: flex; align-items: center; gap: 20px;">
                <div class="version-selector" style="display: flex; align-items: center; gap: 10px; background: rgba(0,0,0,0.3); padding: 5px 15px; border-radius: 8px; border: 1px solid var(--color-border);">
                    <label style="font-weight: bold; color: var(--color-accent-light);">진행 방식 :</label>
                    <select id="game-version-select" onchange="saveGameVersion()" style="padding: 5px 10px; background: #333; color: #fff; border: 1px solid var(--color-accent); border-radius: 4px; font-family: inherit; font-size: 1rem; cursor: pointer;">
                        <option value="online">온라인 단독 버전</option>
                        <option value="combined">온오프라인 결합 버전</option>
                    </select>
                </div>
                <span>입궐 모둠 : <strong id="total-teams" style="color: var(--color-accent-light); font-size:1.4rem;">0</strong> 팀</span>
                <button onclick="downloadCSV()" class="btn-primary" style="background-color: #27ae60;">기록 다운로드 (CSV)</button>
                <button onclick="downloadImage()" class="btn-primary" style="background-color: #2980b9;">화면 이미지 저장</button>
                <button onclick="resetData()" class="btn-danger">기록 파기 (초기화)</button>
            </div>
        </div>
        
        <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; margin-bottom: 15px;">
            <div style="background: rgba(0,0,0,0.3); padding: 10px 15px; border-radius: 6px; border: 1px solid rgba(230, 184, 162, 0.4); font-size: 0.85rem; color: #ddd; line-height: 1.5; font-family: 'Gowun Dodum', sans-serif; flex: 1; min-width: 400px;">
                <strong style="color: #e6b8a2; font-size: 0.9rem;">🌱 청소년기 영양 및 식생활 성취기준</strong><br>
                <span style="color: #bbb; margin-top: 4px; display: inline-block;">"청소년기에 필요한 영양소의 종류와 기능을 이해하고, 자신에게 필요한 영양소를 고려하여 균형 잡힌 식생활을 실천한다."</span>
            </div>
            
            <div class="search-panel" style="display: flex; gap: 8px; align-items: center;">
                <select id="filter-grade" onchange="filterTeams()" style="padding: 8px 10px; border-radius: 4px; border: 1px solid var(--color-accent); background: rgba(0,0,0,0.5); color: #fff; font-family: inherit; font-size: 0.95rem; cursor: pointer;">
                    <option value="">전체 학년</option>
                </select>
                <select id="filter-class" onchange="filterTeams()" style="padding: 8px 10px; border-radius: 4px; border: 1px solid var(--color-accent); background: rgba(0,0,0,0.5); color: #fff; font-family: inherit; font-size: 0.95rem; cursor: pointer;">
                    <option value="">전체 반</option>
                </select>
                <input type="text" id="search-input" onkeyup="filterTeams()" placeholder="🔎 이름 검색 (예: 1모둠)" style="padding: 8px 15px; border-radius: 4px; border: 1px solid var(--color-accent); background: rgba(0,0,0,0.5); color: #fff; width: 180px; font-family: inherit; font-size: 0.95rem;">
            </div>
        </div>
    </header>

    <main>
        <table class="dashboard-table">
            <thead>
                <tr>
                    <th style="width: 12%;">수사관 (모둠)</th>
                    <th style="width: 22%;">수사 진척도 (관문)</th>
                    <th style="width: 26%;">범행 추리 근거</th>
                    <th style="width: 20%;">최종 제출 식단</th>
                    <th style="width: 20%;">과정중심평가</th>
                </tr>
            </thead>
            <tbody id="team-list-body">
                <tr>
                    <td colspan="5" style="color: #888; padding: 40px;">입궐한 수사관을 기다리는 중이옵니다...</td>
                </tr>
            </tbody>
        </table>
    </main>

    <footer class="site-footer">
        <div class="footer-links">
            <a href="../개인정보처리방침.md" target="_blank">개인정보처리방침</a>
            <a href="../이용약관.md" target="_blank">이용약관</a>
        </div>
        <div class="footer-copy">BY. LJY</div>
    </footer>

    <!-- 모달: 어의 문진표 -->
    <div id="counseling-modal">
        <div class="modal-content">
            <button onclick="closeCounselingModal()" class="btn-close">&times;</button>
            
            <h2 id="modal-team-name" class="modal-title">수사관 문진 기록</h2>
            
            <div class="modal-section">
                <h3 class="section-title-1">📜 초기 수라상 (기존 식단)</h3>
                <div id="modal-original-diet" class="modal-box"></div>
            </div>

            <div class="modal-section" style="flex-grow: 1;">
                <h3 class="section-title-2">🩺 어의(AI) 문진 내역</h3>
                <div id="modal-chat-log" class="chat-box">
                    <!-- 채팅 내역 -->
                </div>
            </div>

            <div class="modal-section" style="margin-bottom: 0;">
                <h3 class="section-title-3">🍲 최종 수라상 처방</h3>
                <div id="modal-final-diet" class="modal-box final-diet-box"></div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script type="module" src="../app/firebase-config.js"></script>
    <script type="module" src="dashboard.js?v=12"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>수라간의 비밀 - 로딩 중...</title>
    <style>
        body {
            background-color: #121212;
            color: #d4af37;
            display: flex; align-items: center; justify-content: center;
            min-height: 100vh; margin: 0;
            font-family: 'Gowun Dodum', sans-serif; font-size: 1.2rem;
        }
    </style>
</head>
<body>
    <p>궁궐 문을 여는 중이오...</p>
    
    <script type="module">
        import { db, doc } from './app/firebase-config.js';
        import { getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        async function routeApp() {
            try {
                const docRef = doc(db, 'settings', 'global');
                const docSnap = await getDoc(docRef);
                let targetUrl = 'app/?v=13'; // 기본값 (온라인 단독)
                
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    if (data.version === 'combined') {
                        targetUrl = 'app-hybrid/?v=14';
                    }
                }
                window.location.href = targetUrl;
            } catch (error) {
                console.error("라우팅 오류:", error);
                window.location.href = 'app/?v=13'; // 오류 시 기본값으로 강제 이동
            }
        }
        
        routeApp();
    </script>
</body>
</html>
